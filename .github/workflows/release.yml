name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # A manual run is a dry run: everything except the NuGet push and the GitHub Release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Verify tag, version and changelog
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Encoding UTF8
          $version = $props.SelectSingleNode("//Project/PropertyGroup/PackageVersion").InnerText
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$version" }
          ./Build/assert-release-version.ps1 -Tag $tag -DirectoryBuildPropsPath Directory.Build.props -ChangelogPath CHANGELOG.md
          ./Build/extract-release-notes.ps1 -Version $version -ChangelogPath CHANGELOG.md -OutputPath release-notes.md

      - name: Stamp version
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          ./Build/patch-build-props.ps1 -DirectoryBuildPropsPath Directory.Build.props -BuildId $env:GITHUB_RUN_NUMBER -InformationalVersionSuffix "+$sha"

      - run: dotnet build BricklinkSharp.sln -c Release

      - name: Test
        run: dotnet test BricklinkSharp.Client.Tests -c Release --no-build

      - run: dotnet pack BricklinkSharp.Client -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            artifacts/*.nupkg
            release-notes.md

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 9.0.x

      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: gebirgslok

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
